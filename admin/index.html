<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#013d75" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ingreso</title>
    <link rel="icon" href="../assets/logo-fiis.png" />
    <link rel="stylesheet" href="../assets/css/fonts.css?v=6" />
    <link rel="stylesheet" href="../assets/css/app.css?v=6" />
    <script src="../assets/js/auth.js?v=6"></script>
    <script>
      // En Vercel el login se sirve como "/admin" (sin barra final): "panel.html" a secas apuntaría a "/panel.html".
      window.PANEL_URL = (/(\.html|\/)$/.test(location.pathname) ? "" : location.pathname.split("/").pop() + "/") + "panel.html#/panel"
      // Con sesión válida no tiene sentido mostrar el login.
      if (FIISAuth.getSession()) location.replace(PANEL_URL)
    </script>
  </head>
  <body>
    <!-- admin/page.tsx + AdminLogin.tsx, con los mismos className -->
    <main class="admin-gate-fondo flex min-h-svh items-center justify-center px-4 py-10">
      <section class="admin-gate relative" aria-labelledby="admin-login-title">
        <a href="../index.html" class="admin-gate__logo flex w-full justify-center" aria-label="Ciclo de Conferencias FIIS — sitio público">
          <img src="../assets/img/logo-fiis-96.webp" srcset="../assets/img/logo-fiis-64.webp 1x, ../assets/img/logo-fiis-96.webp 2x" alt="" width="56" height="56" decoding="async" data-nimg="1" style="color:transparent" class="h-14 w-14 object-contain" />
        </a>
        <h1 id="admin-login-title" class="admin-gate__title">Ingreso</h1>
        <p class="admin-gate__lead">Acceso del equipo de la FIIS.</p>
        <p role="status" class="mt-4 mb-0 rounded-xl bg-parchment px-3 py-2 text-sm text-ink" id="sesion-expirada" hidden>
          Tu sesión terminó. Vuelve a ingresar.
        </p>

        <form class="mt-6 grid gap-4" id="login-form" novalidate>
          <label class="grid gap-1.5 text-sm font-semibold text-ink">
            Correo
            <input name="correo" type="email" autocomplete="username" autofocus spellcheck="false" class="field font-normal" aria-invalid="false" />
            <span class="text-xs font-medium text-red-700" data-error="email" hidden></span>
          </label>

          <label class="grid gap-1.5 text-sm font-semibold text-ink">
            Contraseña
            <span class="admin-password">
              <input name="password" type="password" autocomplete="current-password" class="field font-normal" aria-invalid="false" />
              <button type="button" class="admin-password__toggle" aria-pressed="false" id="toggle-password">Mostrar</button>
            </span>
            <span class="text-xs font-medium text-red-700" data-error="password" hidden></span>
          </label>

          <p role="alert" class="m-0 text-sm font-medium text-red-700" id="login-message" hidden></p>

          <button type="submit" class="btn-primary mt-1 w-full" id="login-submit">Ingresar</button>
        </form>

        <a href="../index.html" class="admin-gate__back">Volver al sitio</a>
      </section>
    </main>

    <script>
      ;(function () {
        if (new URLSearchParams(location.search).get("sesion") === "expirada") {
          document.getElementById("sesion-expirada").hidden = false
        }

        const form = document.getElementById("login-form")
        const email = form.elements.correo
        const password = form.elements.password
        const submit = document.getElementById("login-submit")
        const message = document.getElementById("login-message")
        const toggle = document.getElementById("toggle-password")

        toggle.addEventListener("click", () => {
          const show = password.type === "password"
          password.type = show ? "text" : "password"
          toggle.textContent = show ? "Ocultar" : "Mostrar"
          toggle.setAttribute("aria-pressed", String(show))
        })

        function setError(key, text, input) {
          const el = form.querySelector(`[data-error="${key}"]`)
          el.textContent = text || ""
          el.hidden = !text
          input.setAttribute("aria-invalid", String(Boolean(text)))
        }

        // signIn() de actions.ts: validación, mensajes y estado "Ingresando…".
        form.addEventListener("submit", (e) => {
          e.preventDefault()
          if (submit.disabled) return
          message.hidden = true
          const correo = email.value.trim()
          const errEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo) ? "" : "Escribe un correo válido."
          const errPass = password.value.length === 0 ? "Escribe tu contraseña." : ""
          setError("email", errEmail, email)
          setError("password", errPass, password)
          if (errEmail || errPass) return

          submit.disabled = true
          submit.textContent = "Ingresando…"
          setTimeout(() => {
            const result = FIISAuth.login(correo, password.value)
            if (result.ok) {
              location.replace(PANEL_URL)
              return
            }
            message.textContent = result.message
            message.hidden = false
            submit.disabled = false
            submit.textContent = "Ingresar"
          }, 450)
        })
      })()
    </script>
  </body>
</html>
